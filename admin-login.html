<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusLock - Admin Login</title><link rel="stylesheet" href="style.css"></head><body><div class="auth"><div class="auth-card"><div class="logo">🛠️</div><h1>CampusLock</h1><p>College Admin Login</p><form id="adminForm"><label>Admin ID</label><input id="adminId" value="admin" required><label>Password</label><input id="adminPassword" type="password" required><button class="primary full">Admin Login</button></form><p class="switch"><a class="link" href="/">Back to Student Login</a></p></div></div><div class="toast" id="toast"></div><script src="app.js"></script><script>document.getElementById('adminForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({adminId:document.getElementById('adminId').value,password:document.getElementById('adminPassword').value})});localStorage.setItem('campuslockToken',d.token);localStorage.setItem('campuslockMe',JSON.stringify(d.admin));localStorage.setItem('campuslockRole','admin');location.replace('/admin.html')}catch(err){toast(err.message)}};</script></body></html>
