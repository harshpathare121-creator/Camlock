<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusLock - Register</title><link rel="stylesheet" href="style.css"></head><body><div class="auth"><div class="auth-card"><div class="logo">🔐</div><h1>CampusLock</h1><p>Student Registration</p><form id="registerForm"><label>Name</label><input id="regName" required><label>Student ID</label><input id="regId" placeholder="CL2026-001" required><label>Locality</label><input id="regLocality" placeholder="Kalyan West" required><label>Distance from College (km)</label><input id="regDistance" type="number" min="0" step="0.1" required><label>Password</label><input id="regPassword" type="password" required><button class="primary full">Create Account</button></form><p class="switch">Already registered? <a class="link" href="/">Login</a></p></div></div><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
